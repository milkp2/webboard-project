<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
 <div class="container-fluid">
    
    <!-- ชื่อเว็บไซต์ ฝั่งซ้าย -->
    <a class="navbar-brand" href="#">Web Board</a>
    <!-- ค้นหา -->
    <form class="d-flex mx-auto gap-2" role="search" style="width: 900px;">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
      <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
    <!-- เมนู ข้างบนขวา -->
    <ul class="nav nav-pills gap-2 d-flex mx-auto">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{{ url_for('index') }}">Home</a>
        </li>
         <li class="nav-item">
            <span class="navbar-text">
        {{ session['username'] }}
            </span>
         </li>
      <li class="nav-item">
        <a class="btn btn-outline-danger"
        href="{{ url_for('logout') }}">
         Log Out
        </a>
      </li>
    </ul>
</div>
  </nav>
    </div>
    <div class ="container">
    <h2 class="text-center mt-5">สร้างกระทู้ใหม่</h2>
    <form action="{{ url_for('create') }}" method="post" class="mx-auto mt-4" style="max-width: 600px;">
        <div class="mb-3">
            <label for="title" class="form-label">หัวข้อ:</label>
            <input type="text" class="form-control" id="title" name="title" placeholder="กรุณาใส่หัวข้อกระทู้" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">เนื้อหา:</label>
            <textarea class="form-control" id="content" name="content" rows="5" placeholder="กรุณาใส่เนื้อหากระทู้" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">สร้างกระทู้</button>
    </form>
    </div>
    <!--bootstrap javascript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
