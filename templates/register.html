<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
 <div class="container-fluid">
    
    <!-- ชื่อเว็บไซต์ ฝั่งซ้าย -->
    <a class="navbar-brand" href="#">Web Board</a>
    <!-- ค้นหา -->
    <form class="d-flex mx-auto" role="search" style="width: 900px;">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
      <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
    <!-- เมนู ข้างบนขวา -->
    <ul class="nav nav-pills gap-2">
          <li class="nav-item">
            <a class="nav-link " aria-current="page" href="{{ url_for('index') }}">Home</a>
        </li>
        <li class="nav-item ">
             <a class="nav-link " aria-current="page" href="{{ url_for('login') }}">Log In</a>
        </li>
        <li class="nav-item ">
            <a class="nav-link active" aria-current="page" href="{{ url_for('register') }}">Sign Up</a>
        </li>

    </ul>
</div>
    </div>
    
  </nav>
</div>
    <!--bootstrap javascript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
     crossorigin="anonymous"></script>
    <!-- เนื้อหาของหน้า Register -->
 <div class="container"
     style="max-width: 400px;
            margin-top: 100px;
            background-color: #111827;
            color: white;
            padding: 20px;
            border-radius: 8px;">
        <h1 class="text-center">สมัครสมาชิก</h1>
        <form action="{{ url_for('register') }}" method="post">
            <label for="username" class="form-label mt-3">
                ชื่อผู้ใช้ :
            </label>
            <input type="text"
                   id="username"
                   name="username" 
                   class="form-control"
                   placeholder="กรุณาใส่ชื่อผู้ใช้"
                   required>

            <label for="password" class="form-label mt-3">
                รหัสผ่าน :
            </label>
            <input type="password" 
                   id="password"
                   name="password" 
                   class="form-control"
                   placeholder="กรุณาใส่รหัสผ่าน"
                   required>

            <button type="submit"
                    class="btn btn-primary w-100 mt-3">
                สมัครสมาชิก
            </button>
            {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}

        {% for category, message in messages %}

            <div class="alert alert-{{ category }} mt-3" role="alert">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}
{% endwith %}
        </form>
        <p class="text-center mt-2">
            มีบัญชีแล้ว? 
            <a href="{{ url_for('login') }}">
                เข้าสู่ระบบที่นี่
            </a>
        </p>
    </div>
</body>
</html>
